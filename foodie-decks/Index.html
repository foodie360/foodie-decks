<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#0d0d0d; }
  .header {
    position: sticky; top:0; z-index:200; height:48px;
    background:#111; color:#eee; display:flex; align-items:center;
    padding:0 18px; font-size:13px; border-bottom: 2px solid #E8473F;
  }
  .header .label { opacity:0.75; letter-spacing:0.5px; }

  .imgsec { position:relative; width:100%; line-height:0; }
  .hs {
    position:absolute; background:rgba(255,255,255,0); border:0; cursor:pointer; padding:0; margin:0;
    -webkit-tap-highlight-color: transparent;
  }
  .hs:hover { background:rgba(255,255,255,0.14); outline:2px solid rgba(255,255,255,0.55); }

  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:#1a1a1a; color:#fff; border:1px solid #E8473F; padding:12px 20px; border-radius:5px;
    font-size:14px; opacity:0; transition:opacity .25s ease, transform .25s ease; z-index:999; pointer-events:none;
    max-width:80vw; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .phone-stage { background:#2b2b2b; padding:32px 16px; display:flex; justify-content:center; min-height:100vh; }
  .phone-col {
    width:500px; max-width:100%; background:#0d0d0d; border-radius:22px; overflow:hidden;
    box-shadow: 0 0 0 8px #1a1a1a, 0 20px 60px rgba(0,0,0,0.55);
  }
  .navm-bar {
    background:#111; display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; position:relative; z-index:170;
  }
  .navm-logo-img { height:48px; width:auto; display:block; }
  .navm-burger { background:none; border:0; cursor:pointer; padding:6px; display:flex; flex-direction:column; gap:5px; }
  .navm-burger span { width:24px; height:2px; background:#fff; display:block; }
  .navm-menu {
    display:none; flex-direction:column; background:#111; padding:6px 18px 18px; gap:2px;
    position:relative; z-index:165;
  }
  .navm-menu.open { display:flex; }
  .navm-menu > a { color:#f0e9df; text-decoration:none; font-weight:bold; font-size:13px; letter-spacing:0.5px; padding:11px 0; border-bottom:1px solid #262626; cursor:pointer; }
  .navm-order { margin-top:10px; text-align:center; background:linear-gradient(180deg,#e2691f,#a8420f); border-radius:2px; padding:11px 0 !important; border-bottom:none !important; }
  .dropdown-m { border-bottom:1px solid #262626; }
  .dd-trigger-m { display:flex; align-items:center; justify-content:space-between; color:#f0e9df; font-weight:bold; font-size:13px; letter-spacing:0.5px; padding:11px 0; cursor:pointer; }
  .chev { font-size:10px; transition:transform .15s ease; }
  .dd-menu-m { display:none; flex-direction:column; padding:0 0 8px 14px; gap:8px; }
  .dropdown-m.open .dd-menu-m { display:flex; }
  .dropdown-m.open .chev { transform:rotate(180deg); }
  .dd-menu-m a { color:#e2691f; text-decoration:none; font-size:12px; font-weight:bold; letter-spacing:0.5px; cursor:pointer; }
  .dd-menu-m a:not(:first-child) { color:#cfcfcf; }
</style>

<div id="toastBox" class="toast"></div>

<script>
let toastTimer;
function toast(msg) {
  const box = document.getElementById('toastBox');
  box.textContent = msg;
  box.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('show'), 2200);
}
function toggleMobileMenu() {
  document.getElementById('mobileMenuPanel').classList.toggle('open');
}
function closeMobileMenu() {
  document.getElementById('mobileMenuPanel').classList.remove('open');
  document.querySelectorAll('.dropdown-m.open').forEach(d => d.classList.remove('open'));
}
function toggleSubmenu(el) {
  const dd = el.closest('.dropdown-m');
  const wasOpen = dd.classList.contains('open');
  document.querySelectorAll('.dropdown-m.open').forEach(d => d.classList.remove('open'));
  if (!wasOpen) dd.classList.add('open');
}
document.addEventListener('click', function(e) {
  const a = e.target.closest('a[href^="#"]');
  if (a) {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) { e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
  }
});
</script>
